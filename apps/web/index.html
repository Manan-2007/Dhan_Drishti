<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Dhan Drishti</title>
    <meta name="description" content="Private, self-hosted investment portfolio & wealth tracker" />
    <script>
      // Apply saved theme before paint to avoid a flash of the wrong mode.
      (function () {
        try {
          var t = localStorage.getItem("dd-theme");
          var dark = t === "dark" || (!t && window.matchMedia("(prefers-color-scheme: dark)").matches);
          if (dark) document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
